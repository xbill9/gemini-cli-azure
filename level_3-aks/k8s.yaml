apiVersion: apps/v1
kind: Deployment
metadata:
  name: biometric-scout-app
  labels:
    app: biometric-scout-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biometric-scout-app
  template:
    metadata:
      labels:
        app: biometric-scout-app
    spec:
      containers:
      - name: biometric-scout-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID_PLACEHOLDER"
        - name: GOOGLE_CLOUD_LOCATION
          value: "us-east1"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "False"
        - name: VERTEX_AI
          value: "FALSE"
        - name: VERTEX
          value: "no"
        - name: GOOGLE_API_KEY
          value: "GEMINI_API_KEY_PLACEHOLDER"
        - name: MODEL_ID
          value: "gemini-2.5-flash-native-audio-preview-12-2025"
---
apiVersion: v1
kind: Service
metadata:
  name: biometric-scout-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: biometric-scout-app
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biometric-scout-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: "selfsigned-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - 20.104.136.242.nip.io
    secretName: biometric-scout-tls
  rules:
  - host: 20.104.136.242.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: biometric-scout-service
            port:
              number: 80
